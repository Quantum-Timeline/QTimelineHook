name: Resolve a shared-engine event on Robinhood Mainnet

# One workflow for every event that runs on the shared IPO-engine contracts (no contract redeploy per event).
# The data source is chosen per run: 'bea' (US Core PCE), 'bls' (US unemployment rate) or 'sec' (an SEC 424B4 offering price). The market must already be
# bound to the same source on chain (setMarketSource), and the resolver refuses to sign otherwise.

on:
  schedule:
    # Core PCE for October 2026: BEA releases on 25 Nov at 13:30 UTC; poll every 15 minutes through 27 Nov.
    - cron: '*/15 13-18 25-27 11 *'
    # US unemployment rate for November 2026: BLS releases on 4 Dec at 13:30 UTC; poll every 15 minutes through 6 Dec.
    - cron: '*/15 13-18 4-6 12 *'
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Deployed and sealed shared-engine manifest.
        required: true
        type: string
        default: deployments/robinhood-mainnet-ipo.json
      market_id:
        description: Activated market ID.
        required: true
        type: string
      period:
        description: Period string encoded in the market (for example CORE-PCE-2026-10).
        required: true
        type: string
      event_source:
        description: Data source, 'bea', 'bls' or 'sec'.
        required: true
        type: string
        default: bea
      bea_data_period:
        description: For the bea source, the data month (YYYY-MM), for example 2026-10.
        required: false
        type: string
        default: 2026-10
      bls_data_period:
        description: For the bls source, the data month (YYYY-MM), for example 2026-11.
        required: false
        type: string
        default: 2026-11
      broadcast:
        description: Submit the simulated report transaction (leave false for dry run).
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: event-mainnet-${{ inputs.period || vars.QT_EVENT_PERIOD || 'scheduled' }}
  cancel-in-progress: false

jobs:
  resolve-event:
    if: github.event_name == 'workflow_dispatch' || vars.QTIMELINE_EVENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: robinhood-mainnet-ipo
    env:
      QTIMELINE_IPO_MANIFEST: ${{ inputs.manifest_path || vars.QTIMELINE_IPO_MANIFEST || 'deployments/robinhood-mainnet-ipo.json' }}
      QT_IPO_MARKET_ID: ${{ inputs.market_id || vars.QTIMELINE_EVENT_MARKET_ID }}
      QT_IPO_PERIOD: ${{ inputs.period || vars.QT_EVENT_PERIOD }}
      QT_EVENT_SOURCE: ${{ inputs.event_source || vars.QT_EVENT_SOURCE || 'bea' }}
      QT_BEA_DATA_PERIOD: ${{ inputs.bea_data_period || vars.QT_BEA_DATA_PERIOD }}
      QT_BLS_DATA_PERIOD: ${{ inputs.bls_data_period || vars.QT_BLS_DATA_PERIOD }}
      QT_BLS_USER_AGENT: ${{ vars.QT_BLS_USER_AGENT }}
      QT_SEC_USER_AGENT: ${{ vars.QT_SEC_USER_AGENT }}
      QT_BROADCAST: ${{ github.event_name == 'schedule' && '1' || (inputs.broadcast && '1' || '0') }}
    steps:
      # Checkout runs first: the verification below tests that the manifest file exists in the workspace.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Verify the run is explicitly configured
        shell: bash
        run: |
          test -f "$QTIMELINE_IPO_MANIFEST" || { echo "Manifest does not exist: $QTIMELINE_IPO_MANIFEST" >&2; exit 1; }
          test -n "$QT_IPO_MARKET_ID" || { echo "Market ID is not configured." >&2; exit 1; }
          test -n "$QT_IPO_PERIOD" || { echo "Period is not configured." >&2; exit 1; }
          if [[ "$QT_EVENT_SOURCE" == "bea" ]]; then
            test -n "$QT_BEA_DATA_PERIOD" || { echo "QT_BEA_DATA_PERIOD is not configured for the bea source." >&2; exit 1; }
          elif [[ "$QT_EVENT_SOURCE" == "bls" ]]; then
            test -n "$QT_BLS_DATA_PERIOD" || { echo "QT_BLS_DATA_PERIOD is not configured for the bls source." >&2; exit 1; }
            [[ "$QT_BLS_USER_AGENT" == *@* ]] || { echo "QT_BLS_USER_AGENT must include a contact email; BLS blocks bots that do not identify themselves." >&2; exit 1; }
          elif [[ "$QT_EVENT_SOURCE" == "sec" ]]; then
            test -n "$QT_SEC_USER_AGENT" || { echo "QT_SEC_USER_AGENT is not configured; the SEC requires a declared contact." >&2; exit 1; }
          else
            echo "QT_EVENT_SOURCE must be bea, bls or sec." >&2; exit 1
          fi
          if [[ "$QT_BROADCAST" == "1" && "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.broadcast }}" != "true" ]]; then
            echo "Manual runs default to simulation; broadcast requires the explicit input." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qtimeline/resolver test
      - run: forge build --root contracts
      - name: Read the source, sign, simulate, and conditionally submit the value
        env:
          QT_MAINNET_RPC: ${{ secrets.QT_MAINNET_RPC }}
          QT_MAINNET_RELAYER_ADDRESS: ${{ secrets.QT_MAINNET_RELAYER_ADDRESS }}
          QT_MAINNET_RELAYER_PRIVATE_KEY: ${{ secrets.QT_MAINNET_RELAYER_PRIVATE_KEY }}
          QT_IPO_RESOLVER_ECDSA_PRIVATE_KEY: ${{ secrets.QT_IPO_RESOLVER_ECDSA_PRIVATE_KEY }}
          QT_IPO_RESOLVER_MLDSA_SEED_HEX: ${{ secrets.QT_IPO_RESOLVER_MLDSA_SEED_HEX }}
        run: pnpm --filter @qtimeline/resolver resolve:ipo
      - name: Preserve public resolution evidence
        if: always() && hashFiles('resolver-result-ipo.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: event-mainnet-resolution-${{ inputs.period || vars.QT_EVENT_PERIOD || 'scheduled' }}
          path: resolver-result-ipo.json
          if-no-files-found: error
          retention-days: 90
