name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qtimeline/resolver test
      - run: pnpm typecheck
      - run: node contracts/scripts/compile.mjs
      - run: forge build --root contracts
      - run: pnpm contracts:test
      - run: pnpm contracts:test:release
      - run: pnpm build
