name: Resolve BEA market on Robinhood Mainnet

on:
  schedule:
    # October 2026 BEA PIO release: Nov 25 at 13:30 UTC; poll through Nov 27.
    - cron: '*/15 13-18 25-27 11 *'
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Deployed and sealed Mainnet manifest.
        required: true
        type: string
        default: deployments/robinhood-mainnet.json
      market_id:
        description: Activated Mainnet market ID for the selected BEA period.
        required: true
        type: string
      period:
        description: Monthly BEA period encoded in the Mainnet market (YYYY-MM).
        required: true
        type: string
        default: 2026-10
      release_url:
        description: Canonical BEA Personal Income and Outlays article URL.
        required: true
        type: string
        default: https://www.bea.gov/news/2026/personal-income-and-outlays-october-2026
      broadcast:
        description: Submit the simulated report transaction (leave false for dry run).
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bea-mainnet-${{ inputs.period || vars.BEA_PERIOD_ID || 'scheduled' }}
  cancel-in-progress: false

jobs:
  resolve-mainnet:
    if: github.event_name == 'workflow_dispatch' || vars.QTIMELINE_MAINNET_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: robinhood-mainnet
    env:
      QTIMELINE_MAINNET_MANIFEST: ${{ inputs.manifest_path || vars.QTIMELINE_MAINNET_MANIFEST }}
      QT_MAINNET_MARKET_ID: ${{ inputs.market_id || vars.QTIMELINE_MAINNET_MARKET_ID }}
      BEA_PERIOD_ID: ${{ inputs.period || vars.BEA_PERIOD_ID }}
      BEA_RELEASE_URL: ${{ inputs.release_url || vars.BEA_RELEASE_URL }}
      QT_BROADCAST: ${{ github.event_name == 'schedule' && '1' || (inputs.broadcast && '1' || '0') }}
    steps:
      - name: Verify Mainnet run is explicitly configured
        shell: bash
        run: |
          test -n "$QTIMELINE_MAINNET_MANIFEST" || { echo "Mainnet manifest is not configured." >&2; exit 1; }
          test -f "$QTIMELINE_MAINNET_MANIFEST" || { echo "Mainnet manifest does not exist: $QTIMELINE_MAINNET_MANIFEST" >&2; exit 1; }
          test -n "$QT_MAINNET_MARKET_ID" || { echo "Mainnet market ID is not configured." >&2; exit 1; }
          test -n "$BEA_PERIOD_ID" || { echo "BEA period is not configured." >&2; exit 1; }
          test -n "$BEA_RELEASE_URL" || { echo "BEA release URL is not configured." >&2; exit 1; }
          if [[ "$QT_BROADCAST" == "1" && "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.broadcast }}" != "true" ]]; then
            echo "Manual Mainnet runs default to simulation; broadcast requires the explicit input." >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qtimeline/resolver test
      - run: forge build --root contracts
      - name: Validate Mainnet bot keys and market (read only)
        env:
          QT_MAINNET_RPC: ${{ secrets.QT_MAINNET_RPC }}
          QT_MAINNET_RELAYER_ADDRESS: ${{ secrets.QT_MAINNET_RELAYER_ADDRESS }}
          QT_MAINNET_RELAYER_PRIVATE_KEY: ${{ secrets.QT_MAINNET_RELAYER_PRIVATE_KEY }}
          QT_MAINNET_RESOLVER_ECDSA_PRIVATE_KEY: ${{ secrets.QT_MAINNET_RESOLVER_ECDSA_PRIVATE_KEY }}
          QT_MAINNET_RESOLVER_MLDSA_SEED_HEX: ${{ secrets.QT_MAINNET_RESOLVER_MLDSA_SEED_HEX }}
        run: pnpm --filter @qtimeline/resolver validate:mainnet-config
      - name: Parse, sign, simulate, and conditionally submit BEA report
        env:
          QT_MAINNET_RPC: ${{ secrets.QT_MAINNET_RPC }}
          QT_MAINNET_RELAYER_ADDRESS: ${{ secrets.QT_MAINNET_RELAYER_ADDRESS }}
          QT_MAINNET_RELAYER_PRIVATE_KEY: ${{ secrets.QT_MAINNET_RELAYER_PRIVATE_KEY }}
          QT_MAINNET_RESOLVER_ECDSA_PRIVATE_KEY: ${{ secrets.QT_MAINNET_RESOLVER_ECDSA_PRIVATE_KEY }}
          QT_MAINNET_RESOLVER_MLDSA_SEED_HEX: ${{ secrets.QT_MAINNET_RESOLVER_MLDSA_SEED_HEX }}
        run: pnpm --filter @qtimeline/resolver resolve:mainnet
      - name: Preserve public resolution evidence
        if: always() && hashFiles('resolver-result.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bea-mainnet-resolution-${{ inputs.period || vars.BEA_PERIOD_ID || 'scheduled' }}
          path: resolver-result.json
          if-no-files-found: error
          retention-days: 90
