name: Deploy web to Cloudflare Pages

# Every push to main that touches the web app builds the static export with the production environment and publishes it.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
# The public NEXT_PUBLIC_* values live in repository variables (the RPC URL is a secret); they end up in the public bundle anyway.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.creds.outputs.ready == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.creds.outputs.ready == 'true'
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the static export
        if: steps.creds.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_RH_RPC: ${{ secrets.NEXT_PUBLIC_RH_RPC }}
          NEXT_PUBLIC_RH_CHAIN_ID: ${{ vars.NEXT_PUBLIC_RH_CHAIN_ID }}
          NEXT_PUBLIC_REGISTRY: ${{ vars.NEXT_PUBLIC_REGISTRY }}
          NEXT_PUBLIC_FACTORY: ${{ vars.NEXT_PUBLIC_FACTORY }}
          NEXT_PUBLIC_ROUTER: ${{ vars.NEXT_PUBLIC_ROUTER }}
          NEXT_PUBLIC_V4_QUOTER: ${{ vars.NEXT_PUBLIC_V4_QUOTER }}
          NEXT_PUBLIC_MARKET_ID: ${{ vars.NEXT_PUBLIC_MARKET_ID }}
          NEXT_PUBLIC_EVENT_PROFILE: ${{ vars.NEXT_PUBLIC_EVENT_PROFILE }}
          NEXT_PUBLIC_EVENT_KIND: ${{ vars.NEXT_PUBLIC_EVENT_KIND }}
          NEXT_PUBLIC_EVENT_THRESHOLD_BPS: ${{ vars.NEXT_PUBLIC_EVENT_THRESHOLD_BPS }}
          NEXT_PUBLIC_EVENT_PERIOD_LABEL: ${{ vars.NEXT_PUBLIC_EVENT_PERIOD_LABEL }}
          NEXT_PUBLIC_EVENT_CUTOFF_AT: ${{ vars.NEXT_PUBLIC_EVENT_CUTOFF_AT }}
        run: pnpm --filter @qtimeline/web build
      - name: Publish to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy apps/web/out --project-name qtimeline --branch main --commit-hash "$GITHUB_SHA" --commit-message "deploy $GITHUB_SHA"
