name: Resolve Anthropic IPO pricing market on Robinhood Mainnet

on:
  schedule:
    # Expected pricing is 18 Nov 2026 (evening, US time). The 424B4 final prospectus follows, so poll 19-21 Nov from 13:00 UTC.
    - cron: '*/15 13-23 19-21 11 *'
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Deployed and sealed IPO manifest.
        required: true
        type: string
        default: deployments/robinhood-mainnet-ipo.json
      market_id:
        description: Activated IPO market ID.
        required: true
        type: string
      period:
        description: Period string encoded in the IPO market.
        required: true
        type: string
        default: ANT-IPO-PRICE-2026-11
      broadcast:
        description: Submit the simulated report transaction (leave false for dry run).
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ipo-mainnet-${{ inputs.period || vars.QT_IPO_PERIOD || 'scheduled' }}
  cancel-in-progress: false

jobs:
  resolve-ipo:
    if: github.event_name == 'workflow_dispatch' || vars.QTIMELINE_IPO_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: robinhood-mainnet-ipo
    env:
      QTIMELINE_IPO_MANIFEST: ${{ inputs.manifest_path || vars.QTIMELINE_IPO_MANIFEST }}
      QT_IPO_MARKET_ID: ${{ inputs.market_id || vars.QTIMELINE_IPO_MARKET_ID }}
      QT_IPO_PERIOD: ${{ inputs.period || vars.QT_IPO_PERIOD || 'ANT-IPO-PRICE-2026-11' }}
      QT_SEC_USER_AGENT: ${{ vars.QT_SEC_USER_AGENT }}
      QT_BROADCAST: ${{ github.event_name == 'schedule' && '1' || (inputs.broadcast && '1' || '0') }}
    steps:
      # Checkout runs first: the verification below tests that the manifest file exists in the workspace.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Verify IPO run is explicitly configured
        shell: bash
        run: |
          test -n "$QTIMELINE_IPO_MANIFEST" || { echo "IPO manifest is not configured." >&2; exit 1; }
          test -f "$QTIMELINE_IPO_MANIFEST" || { echo "IPO manifest does not exist: $QTIMELINE_IPO_MANIFEST" >&2; exit 1; }
          test -n "$QT_IPO_MARKET_ID" || { echo "IPO market ID is not configured." >&2; exit 1; }
          test -n "$QT_SEC_USER_AGENT" || { echo "QT_SEC_USER_AGENT is not configured; the SEC requires a declared contact." >&2; exit 1; }
          if [[ "$QT_BROADCAST" == "1" && "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.broadcast }}" != "true" ]]; then
            echo "Manual IPO runs default to simulation; broadcast requires the explicit input." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qtimeline/resolver test
      - run: forge build --root contracts
      - name: Read the SEC final prospectus, sign, simulate, and conditionally submit the offering price
        env:
          QT_MAINNET_RPC: ${{ secrets.QT_MAINNET_RPC }}
          QT_MAINNET_RELAYER_ADDRESS: ${{ secrets.QT_MAINNET_RELAYER_ADDRESS }}
          QT_MAINNET_RELAYER_PRIVATE_KEY: ${{ secrets.QT_MAINNET_RELAYER_PRIVATE_KEY }}
          QT_IPO_RESOLVER_ECDSA_PRIVATE_KEY: ${{ secrets.QT_IPO_RESOLVER_ECDSA_PRIVATE_KEY }}
          QT_IPO_RESOLVER_MLDSA_SEED_HEX: ${{ secrets.QT_IPO_RESOLVER_MLDSA_SEED_HEX }}
        run: pnpm --filter @qtimeline/resolver resolve:ipo
      - name: Preserve public resolution evidence
        if: always() && hashFiles('resolver-result-ipo.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipo-mainnet-resolution-${{ inputs.period || vars.QT_IPO_PERIOD || 'scheduled' }}
          path: resolver-result-ipo.json
          if-no-files-found: error
          retention-days: 90
