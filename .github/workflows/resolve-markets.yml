name: Resolve BEA market on Robinhood testnet

on:
  schedule:
    # BEA's October 2026 PIO release is scheduled for Nov 25 at 13:30 UTC.
    # Poll the release day and the two following days for schedule delays.
    - cron: '*/15 13-18 25-27 11 *'
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Activated Robinhood testnet manifest for the selected BEA period.
        required: true
        type: string
      period:
        description: Monthly BEA period encoded in the testnet market (YYYY-MM).
        required: true
        default: 2026-10
        type: string
      release_url:
        description: Canonical BEA Personal Income and Outlays article URL.
        required: true
        default: https://www.bea.gov/news/2026/personal-income-and-outlays-october-2026
        type: string

permissions:
  contents: read

concurrency:
  group: bea-testnet-${{ inputs.period || vars.BEA_PERIOD_ID || 'scheduled' }}
  cancel-in-progress: false

jobs:
  resolve-testnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: robinhood-testnet
    env:
      QTIMELINE_TESTNET_MANIFEST: ${{ inputs.manifest_path || vars.QTIMELINE_TESTNET_MANIFEST }}
      BEA_PERIOD_ID: ${{ inputs.period || vars.BEA_PERIOD_ID }}
      BEA_RELEASE_URL: ${{ inputs.release_url || vars.BEA_RELEASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Wait until an activated market manifest is configured
        id: market
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && ( -z "$QTIMELINE_TESTNET_MANIFEST" || ! -f "$QTIMELINE_TESTNET_MANIFEST" ) ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No testnet market manifest is present; this scheduled poll will not read secrets or submit a transaction."
          elif [[ -z "$QTIMELINE_TESTNET_MANIFEST" || ! -f "$QTIMELINE_TESTNET_MANIFEST" ]]; then
            echo "Required testnet market manifest is missing: $QTIMELINE_TESTNET_MANIFEST" >&2
            exit 1
          elif [[ -z "$BEA_PERIOD_ID" || -z "$BEA_RELEASE_URL" ]]; then
            echo "BEA period and release URL are required." >&2
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.market.outputs.ready == 'true'
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.market.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        if: steps.market.outputs.ready == 'true'
        with:
          version: v1.7.1
      - if: steps.market.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.market.outputs.ready == 'true'
        run: pnpm --filter @qtimeline/resolver test
      - if: steps.market.outputs.ready == 'true'
        run: pnpm contracts:build
      - name: Verify testnet secrets and active BEA market
        if: steps.market.outputs.ready == 'true'
        env:
          QT_TESTNET_RPC: ${{ secrets.QT_TESTNET_RPC }}
          QT_TESTNET_RELAYER_PRIVATE_KEY: ${{ secrets.QT_TESTNET_RELAYER_PRIVATE_KEY }}
          QT_TESTNET_RESOLVER_ECDSA_PRIVATE_KEY: ${{ secrets.QT_TESTNET_RESOLVER_ECDSA_PRIVATE_KEY }}
          QT_TESTNET_RESOLVER_MLDSA_PRIVATE_KEY_PEM: ${{ secrets.QT_TESTNET_RESOLVER_MLDSA_PRIVATE_KEY_PEM }}
        run: pnpm --filter @qtimeline/resolver validate:testnet-config
      - name: Parse, sign, submit, and verify official BEA report on testnet
        if: steps.market.outputs.ready == 'true'
        env:
          QT_BROADCAST: '1'
          QT_TESTNET_RPC: ${{ secrets.QT_TESTNET_RPC }}
          QT_TESTNET_RELAYER_PRIVATE_KEY: ${{ secrets.QT_TESTNET_RELAYER_PRIVATE_KEY }}
          QT_TESTNET_RESOLVER_ECDSA_PRIVATE_KEY: ${{ secrets.QT_TESTNET_RESOLVER_ECDSA_PRIVATE_KEY }}
          QT_TESTNET_RESOLVER_MLDSA_PRIVATE_KEY_PEM: ${{ secrets.QT_TESTNET_RESOLVER_MLDSA_PRIVATE_KEY_PEM }}
        run: pnpm --filter @qtimeline/resolver resolve:testnet:live
      - name: Preserve public resolution evidence
        if: always() && hashFiles('resolver-result.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bea-resolution-${{ inputs.period || vars.BEA_PERIOD_ID || 'scheduled' }}
          path: resolver-result.json
          if-no-files-found: error
          retention-days: 90
